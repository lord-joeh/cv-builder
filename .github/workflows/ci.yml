name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Formatting
        run: npx prettier --check "src/**/*.ts" "src/**/*.tsx"

      - name: Run ESLint
        run: npm run lint

  docker-smoke-test:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Smoke Test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: portfolio-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
